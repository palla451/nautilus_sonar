id: dns_repeated_query
name: Repeated DNS Query
description: Detect repeated DNS queries from the same source to the same domain
enabled: true

source_index: nautilus-events
target_index: nautilus-incidents

filter:
  event_type: dns

group_by:
  - src_ip
  - payload.query

threshold:
  count: 3
  window_seconds: 300

severity: low
incident_type: dns_repeated_query
run_every_seconds: 60