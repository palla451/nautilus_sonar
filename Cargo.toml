[package]
name = "nautilus-sonar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dotenvy = "0.15"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }

redis = "0.25"

reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }

# --- Host info ---
hostname = "0.4"
sysinfo = "0.30"
local-ip-address = "0.6"

uuid = { version = "1", features = ["v4"] }